<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visual segmentation fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: white; font: 700 64px/1.1 system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 1; height: 72px; padding: 16px 24px; background: #111; font-size: 28px; }
      section { height: 620px; display: grid; place-items: center; text-shadow: 0 2px 4px #0008; }
      [data-review-marker="red-alpha"] { background: #d62828; }
      [data-review-marker="green-bravo"] { background: #27823b; }
      [data-review-marker="blue-charlie"] { background: #1769aa; }
      [data-review-marker="yellow-delta"] { background: #f4c430; color: #171717; text-shadow: none; }
      [data-review-marker="purple-echo"] { height: 240px; background: #71368a; }
    </style>
  </head>
  <body>
    <header>SEGMENTATION FIXTURE</header>
    <main>
      <section data-review-marker="red-alpha">RED — ALPHA</section>
      <section data-review-marker="green-bravo">GREEN — BRAVO</section>
      <section data-review-marker="blue-charlie">BLUE — CHARLIE</section>
      <section data-review-marker="yellow-delta">YELLOW — DELTA</section>
      <section data-review-marker="purple-echo">PURPLE — ECHO</section>
    </main>
  </body>
</html>
